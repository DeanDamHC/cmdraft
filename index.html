<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap');

#dota-draft-root {
  --bg: #0b1210;
  --panel: #121c19;
  --panel-alt: #0e1614;
  --gold: #c9a227;
  --gold-dim: #7a662a;
  --radiant: #6fae4b;
  --radiant-dim: rgba(111,174,75,0.14);
  --dire: #c14b4b;
  --dire-dim: rgba(193,75,75,0.14);
  --obs: #7f8fa8;
  --text: #eae4d6;
  --text-dim: #93897a;
  --border: #263029;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  border-radius: 10px;
  padding: 0;
  min-height: 600px;
  overflow: hidden;
  border: 1px solid var(--border);
}

#dota-draft-root * { box-sizing: border-box; }

.dd-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 24px;
  border-bottom: 1px solid var(--border);
  background: linear-gradient(180deg, #142019, #0e1614);
}
.dd-title {
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 20px;
  letter-spacing: 0.5px;
  color: var(--gold);
  margin: 0;
}
.dd-tabs { display: flex; gap: 4px; }
.dd-tab {
  font-family: 'Inter';
  font-size: 13px;
  font-weight: 600;
  color: var(--text-dim);
  background: transparent;
  border: 1px solid var(--border);
  padding: 8px 16px;
  cursor: pointer;
  transition: color .15s, border-color .15s;
}
.dd-tab.active { color: var(--gold); border-color: var(--gold-dim); }
.dd-tab:hover:not(.active) { color: var(--text); }

.dd-body { padding: 20px 24px 28px; }

/* ---- Hero DB ---- */
.dd-controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.dd-search {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  font-size: 13px;
  font-family: 'Inter';
  min-width: 220px;
}
.dd-search:focus { outline: none; border-color: var(--gold-dim); }
.dd-filter-btn {
  background: var(--panel-alt);
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 8px 12px;
  font-size: 12px;
  font-family: 'Inter';
  font-weight: 600;
  cursor: pointer;
}
.dd-filter-btn.active { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.dd-count { font-size: 12px; color: var(--text-dim); margin-left: auto; }

.dd-hero-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
  gap: 10px;
}
.dd-hero-card {
  background: var(--panel);
  border: 1px solid var(--border);
  overflow: hidden;
  cursor: default;
  transition: border-color .15s, transform .15s;
}
.dd-hero-card:hover { border-color: var(--gold-dim); transform: translateY(-2px); }
.dd-hero-img { width: 100%; aspect-ratio: 16/9; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel'; font-weight: 700; font-size: 16px; letter-spacing: 1px; color: rgba(255,255,255,0.92); text-shadow: 0 1px 2px rgba(0,0,0,0.35); }
.dd-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.dd-avatar-label { position: relative; z-index: 0; }
.dd-hero-name { font-size: 11.5px; font-weight: 600; padding: 7px 8px 3px; line-height: 1.25; }
.dd-hero-attr { font-size: 10px; padding: 0 8px 8px; display: flex; align-items: center; gap: 5px; }
.dd-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }

/* ---- Lobby browser ---- */
.dd-lobby-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.dd-lobby-header-row h3 { font-family: 'Cinzel'; color: var(--gold); font-size: 16px; margin: 0; }
.dd-lobby-list { display: flex; flex-direction: column; gap: 8px; }
.dd-lobby-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  background: var(--panel); border: 1px solid var(--border); padding: 12px 14px;
}
.dd-lobby-item-name { font-family: 'Cinzel'; font-weight: 700; font-size: 13px; color: var(--gold); }
.dd-lobby-item-meta { font-size: 11px; color: var(--text-dim); display: flex; gap: 10px; margin-top: 4px; flex-wrap: wrap; }
.dd-lobby-item-meta .fearless { color: var(--dire); }

/* ---- Forms (create / password) ---- */
.dd-lobby {
  max-width: 460px;
  margin: 30px auto;
  background: var(--panel);
  border: 1px solid var(--border);
  padding: 28px;
}
.dd-lobby h3 { font-family: 'Cinzel'; color: var(--gold); font-size: 16px; margin: 0 0 6px; }
.dd-lobby p { font-size: 12.5px; color: var(--text-dim); margin: 0 0 18px; line-height: 1.5; }
.dd-field { margin-bottom: 14px; }
.dd-label { font-size: 11px; text-transform: none; color: var(--text-dim); display: block; margin-bottom: 6px; }
.dd-input {
  width: 100%; background: var(--panel-alt); border: 1px solid var(--border);
  color: var(--text); padding: 9px 11px; font-size: 14px; font-family: 'Inter'; letter-spacing: 0.5px;
}
.dd-input:focus { outline: none; border-color: var(--gold-dim); }
.dd-format-row { display: flex; gap: 8px; }
.dd-format-btn {
  flex: 1; padding: 10px 6px; font-size: 12px; font-weight: 600; cursor: pointer;
  border: 1px solid var(--border); background: var(--panel-alt); color: var(--text-dim);
}
.dd-format-btn.active { color: var(--gold); border-color: var(--gold); background: rgba(201,162,39,0.12); }
.dd-toggle-row { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--panel-alt); border: 1px solid var(--border); cursor: pointer; }
.dd-toggle-row input { accent-color: var(--gold); width: 15px; height: 15px; }
.dd-toggle-row .dd-toggle-text { font-size: 12.5px; }
.dd-toggle-row .dd-toggle-sub { font-size: 10.5px; color: var(--text-dim); display: block; margin-top: 2px; }
.dd-btn-primary {
  width: 100%; margin-top: 4px; padding: 11px; background: var(--gold); color: #1a1408;
  border: none; font-weight: 700; font-size: 13px; cursor: pointer; font-family: 'Inter';
}
.dd-btn-primary:disabled { opacity: .4; cursor: not-allowed; }
.dd-btn-secondary {
  background: transparent; border: 1px solid var(--border); color: var(--text-dim);
  padding: 7px 12px; font-size: 11.5px; cursor: pointer; font-family: 'Inter';
}
.dd-btn-secondary:hover { color: var(--text); border-color: var(--gold-dim); }
.dd-row-gap { display: flex; gap: 8px; }
.dd-row-gap .dd-btn-primary { margin-top: 0; }

/* ---- Waiting room (slots) ---- */
.dd-waiting-slots { display: flex; gap: 14px; margin: 20px 0; }
.dd-slot-box { flex: 1; background: var(--panel); border: 1px dashed var(--border); padding: 26px 12px; text-align: center; cursor: pointer; transition: border-color .15s; }
.dd-slot-box.fp { border-color: var(--radiant-dim); }
.dd-slot-box.sp { border-color: var(--dire-dim); }
.dd-slot-box.obs { border-color: var(--obs); opacity: .75; }
.dd-slot-box.filled.fp { border-style: solid; border-color: var(--radiant); background: var(--radiant-dim); }
.dd-slot-box.filled.sp { border-style: solid; border-color: var(--dire); background: var(--dire-dim); }
.dd-slot-box.obs.filled { border-style: solid; background: rgba(127,143,168,0.14); opacity: 1; }
.dd-slot-box.taken { cursor: not-allowed; }
.dd-slot-box .slot-label { font-family: 'Cinzel'; font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.dd-slot-box.fp .slot-label { color: var(--radiant); }
.dd-slot-box.sp .slot-label { color: var(--dire); }
.dd-slot-box.obs .slot-label { color: var(--obs); }
.dd-slot-box .slot-status { font-size: 11px; color: var(--text-dim); }

/* ---- Draft: series bar ---- */
.dd-series-bar {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  padding: 10px 14px; background: var(--panel-alt); border: 1px solid var(--border); margin-bottom: 10px; font-size: 12.5px;
}
.dd-series-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.dd-fearless-badge { font-family: 'Cinzel'; font-size: 10.5px; font-weight: 700; color: var(--dire); border: 1px solid var(--dire); padding: 3px 8px; letter-spacing: .5px; }
.dd-score { font-family: 'Cinzel'; font-weight: 700; font-size: 14px; }
.dd-score .fp { color: var(--radiant); }
.dd-score .sp { color: var(--dire); }

/* ---- Draft: active ---- */
.dd-status-bar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; background: var(--panel); border: 1px solid var(--border); margin-bottom: 14px;
  font-size: 13px; flex-wrap: wrap; gap: 8px;
}
.dd-status-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.dd-badge { font-family: 'Cinzel'; font-weight: 700; font-size: 12px; padding: 4px 10px; letter-spacing: .5px; }
.dd-badge.ban { color: var(--dire); border: 1px solid var(--dire); }
.dd-badge.pick { color: var(--radiant); border: 1px solid var(--radiant); }
.dd-your-turn { color: var(--gold); font-weight: 700; }
.dd-wait-turn { color: var(--text-dim); }
.dd-timer {
  font-family: 'Cinzel'; font-weight: 700; font-size: 15px; padding: 3px 10px;
  border: 1px solid var(--gold-dim); color: var(--gold); min-width: 56px; text-align: center;
}
.dd-timer.low { color: var(--dire); border-color: var(--dire); }
.dd-timer.reserve { color: var(--obs); border-color: var(--obs); }

.dd-timeline { display: flex; gap: 3px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; }
.dd-tstep {
  width: 20px; height: 20px; flex: none; border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; font-size: 9px; color: var(--text-dim);
}
.dd-tstep.fp { border-color: var(--radiant-dim); }
.dd-tstep.sp { border-color: var(--dire-dim); }
.dd-tstep.done.fp { background: var(--radiant-dim); color: var(--radiant); }
.dd-tstep.done.sp { background: var(--dire-dim); color: var(--dire); }
.dd-tstep.current { outline: 2px solid var(--gold); outline-offset: 1px; }

.dd-draft-layout { display: grid; grid-template-columns: 190px 1fr 190px; gap: 14px; }
@media (max-width: 780px) { .dd-draft-layout { grid-template-columns: 1fr; } }

.dd-team-panel { background: var(--panel); border: 1px solid var(--border); padding: 12px; }
.dd-team-panel.fp { border-left: 3px solid var(--radiant); }
.dd-team-panel.sp { border-left: 3px solid var(--dire); }
.dd-team-title-row { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
.dd-team-title { font-family: 'Cinzel'; font-size: 12px; font-weight: 700; }
.dd-team-panel.fp .dd-team-title { color: var(--radiant); }
.dd-team-panel.sp .dd-team-title { color: var(--dire); }
.dd-team-reserve { font-size: 10px; color: var(--text-dim); }
.dd-slot-label { font-size: 10px; color: var(--text-dim); margin: 8px 0 4px; }
.dd-picks-row { display: flex; flex-direction: column; gap: 4px; }
.dd-bans-row { display: flex; flex-wrap: wrap; gap: 4px; }
.dd-slot { background: var(--panel-alt); border: 1px solid var(--border); display: flex; align-items: center; gap: 6px; padding: 4px; font-size: 10.5px; min-height: 30px; }
.dd-slot-avatar { width: 22px; height: 22px; flex: none; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel'; font-weight: 700; font-size: 8px; color: rgba(255,255,255,0.9); }
.dd-slot.ban-slot { width: 30px; height: 30px; padding: 0; justify-content: center; }
.dd-slot.ban-slot .dd-slot-avatar { width: 100%; height: 100%; filter: grayscale(1) brightness(.55); }
.dd-slot.empty { color: var(--text-dim); justify-content: center; }

.dd-hero-pick-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 7px;
  max-height: 480px; overflow-y: auto; padding-right: 4px;
}
.dd-pick-card {
  background: var(--panel); border: 1px solid var(--border); cursor: pointer; overflow: hidden; position: relative;
  transition: border-color .12s, opacity .12s;
}
.dd-pick-card:hover { border-color: var(--gold); }
.dd-pick-card.disabled { opacity: .22; cursor: not-allowed; pointer-events: none; }
.dd-pick-card.fearless-locked { opacity: .3; cursor: not-allowed; pointer-events: none; }
.dd-pick-card.fearless-locked::after {
  content: '✕ серия'; position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: rgba(11,18,16,0.55); color: var(--dire); font-size: 9px; font-weight: 700; text-align: center;
}

.dd-pick-card .dd-hero-name { font-size: 10px; padding: 5px 6px; }

.dd-empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); font-size: 13px; }
.dd-error { color: var(--dire); font-size: 12.5px; padding: 12px; border: 1px solid var(--dire); background: var(--dire-dim); }
.dd-footer-note { font-size: 11px; color: var(--text-dim); margin-top: 16px; line-height: 1.5; }

/* ---- Game over / series history ---- */
.dd-gameover {
  text-align: center; padding: 24px; background: var(--panel); border: 1px solid var(--gold-dim); margin-bottom: 16px;
}
.dd-gameover h4 { font-family: 'Cinzel'; color: var(--gold); margin: 0 0 4px; font-size: 15px; }
.dd-gameover p { font-size: 12px; color: var(--text-dim); margin: 0 0 16px; }
.dd-winner-row { display: flex; gap: 10px; justify-content: center; }
.dd-winner-btn { padding: 10px 20px; font-family: 'Cinzel'; font-weight: 700; font-size: 12.5px; cursor: pointer; border: 1px solid; background: transparent; }
.dd-winner-btn.fp { color: var(--radiant); border-color: var(--radiant); }
.dd-winner-btn.fp:hover { background: var(--radiant-dim); }
.dd-winner-btn.sp { color: var(--dire); border-color: var(--dire); }
.dd-winner-btn.sp:hover { background: var(--dire-dim); }
.dd-series-over { text-align: center; padding: 26px; background: var(--panel); border: 1px solid var(--gold); margin-bottom: 16px; }
.dd-series-over h4 { font-family: 'Cinzel'; color: var(--gold); font-size: 17px; margin: 0 0 6px; }

.dd-history { margin-bottom: 18px; }
.dd-history h5 { font-family: 'Cinzel'; font-size: 11.5px; color: var(--text-dim); margin: 0 0 8px; letter-spacing: .5px; }
.dd-history-game { display: grid; grid-template-columns: 60px 1fr 1fr; gap: 8px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--border); margin-bottom: 5px; font-size: 10.5px; align-items: center; }
.dd-history-game .num { font-family: 'Cinzel'; color: var(--gold); font-weight: 700; }
.dd-history-picks { display: flex; flex-wrap: wrap; gap: 3px; }
.dd-history-avatar { width: 20px; height: 20px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; font-family: 'Cinzel'; font-weight: 700; font-size: 7px; color: rgba(255,255,255,0.9); }
.dd-history-picks.winner { outline: 1px solid var(--gold); padding: 2px; }
</style>

  <div class="dd-body" id="dd-body"></div>
</div>

    return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  const ATTR_META = {
    str: { label: 'Сила', color: '#c0524a', hue: 355 },
    agi: { label: 'Ловкость', color: '#4a9e6a', hue: 130 },
    int: { label: 'Интеллект', color: '#4a7fc0', hue: 215 },
    all: { label: 'Универсал', color: '#c9a227', hue: 45 }
  };

  // Hero portraits load from Valve's CDN; if a particular image fails, the colour+initials
  // tile underneath stays visible instead (see onerror on the <img> below).
  function hashOf(str) {
    let h = 0;
    for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) >>> 0;
    return h;
  }
  function heroColor(h) {
    const base = ATTR_META[h.attr].hue;
    const hash = hashOf(h.name);
    const hue = (base + (hash % 22) - 11 + 360) % 360;
    const sat = 42 + (hash % 18);
    const light = 26 + (hash % 12);
    return `hsl(${hue} ${sat}% ${light}%)`;
  }
  function heroInitials(name) {
    const stop = new Set(['of', 'the']);
    const parts = name.replace(/-/g, ' ').split(' ').filter(w => w && !stop.has(w.toLowerCase()));
    if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
    return parts.slice(0, 2).map(w => w[0].toUpperCase()).join('');
  }
  function heroAvatar(h, cls) {
    return `<div class="${cls} dd-avatar" style="background:${heroColor(h)}"><span class="dd-avatar-label">${heroInitials(h.name)}</span><img src="${h.img}" alt="${h.name}" loading="lazy" onerror="this.style.display='none'"></div>`;

    ['Sniper','agi','sniper'],['Shadow Fiend','agi','nevermore'],['Weaver','agi','weaver'],['Spectre','agi','spectre'],

    ['Nyx Assassin','all','nyx_assassin'],['Visage','all','visage'],['Magnus','all','magnataur'],['Abaddon','all','abaddon'],
    ['Techies','all','techies'],['Arc Warden','all','arc_warden'],['Pangolier','all','pangolier'],['Snapfire','all','snapfire'],
    ['Void Spirit','all','void_spirit'],['Marci','all','marci']
  ];

  // 7.34 Captains Mode order — 14 bans / 10 picks, 24 steps total
  const SEQUENCE = [
    ['fp','ban'],['fp','ban'],['sp','ban'],['sp','ban'],['fp','ban'],['sp','ban'],['sp','ban'],
    ['fp','pick'],['sp','pick'],
    ['fp','ban'],['fp','ban'],['sp','ban'],
    ['sp','pick'],['fp','pick'],['fp','pick'],['sp','pick'],['sp','pick'],['fp','pick'],
    ['fp','ban'],['sp','ban'],['fp','ban'],['sp','ban'],
    ['fp','pick'],['sp','pick']
  ].map(([side, type], i) => ({ n: i + 1, side, type }));

  const RESERVE_TOTAL = 130; // seconds, per official rules
  const FORMATS = { bo1: 1, bo3: 2, bo5: 3, bo7: 4 }; // format -> wins needed

  let allHeroes = [];
  let activeTab = 'db';
  let dbFilter = 'all';
  let dbSearch = '';
  let draftHeroSearch = '';

  // --- lobby-browser state (per browser) ---
  let lobbyView = 'list'; // 'list' | 'create' | 'password' | 'inside'
  let lobbiesList = [];
  let selectedLobby = null; // { id, name }
  let pwInput = '';
  let pwError = null;
  let createName = '';
  let createPassword = '';
  let lobbyFormat = 'bo3';
  let lobbyFearless = false;
  let busy = false;
  let formError = null;
  let connError = null;

  // --- state once inside a lobby ---
  let lobbyId = '';
  let myRole = null; // 'fp' | 'sp'
  let joined = false;
  let room = null;
  let pollTimer = null;
  let tickTimer = null;
  let listTimer = null;

  function loadHeroes() {
    allHeroes = HERO_DATA
      .map(([name, attr, slug], i) => ({ id: i + 1, name, attr, img: IMG_BASE + slug + '.png' }))
      .sort((a, b) => a.name.localeCompare(b.name));
    render();
  }

  function genId() {
    return Math.random().toString(36).slice(2, 8).toUpperCase();
  }

  function freshGameFields() {
    return { actions: [], stepStartedAt: null, fpReserve: RESERVE_TOTAL, spReserve: RESERVE_TOTAL };
  }

  function initLobbyState(name, password, format, fearless) {
    return {
      name, password,
      createdAt: Date.now(),
      format: format || 'bo1',
      fearless: !!fearless,
      started: false,
      gameNumber: 1,
      fpWins: 0,
      spWins: 0,
      seriesPicked: [],
      history: [],
      fpReady: false,
      spReady: false,
      ...freshGameFields(),
      updatedAt: Date.now()
    };
  }

  // --- Storage backend ---
  // This standalone (hosted) build uses a free Firebase Realtime Database instead of the
  // Claude-artifact-only window.storage API, so the draft can sync between real devices.
  //   1. Go to https://console.firebase.google.com -> Add project (free, no card needed)
  //   2. In the left menu: Build -> Realtime Database -> Create Database -> start in TEST MODE
  //   3. Copy the database URL shown at the top of that page
  //      (looks like https://your-project-id-default-rtdb.europe-west1.firebasedatabase.app)
  //   4. Paste it below, replacing the placeholder text
  const FIREBASE_DB_URL = 'https://vpadlucup-default-rtdb.europe-west1.firebasedatabase.app';
  const FIREBASE_CONFIGURED = !FIREBASE_DB_URL.includes('PASTE_YOUR');

  // --- Admin access ---
  // Lets you delete stale/test lobbies from the list. This is a simple client-side gate, not
  // real security — anyone who views this file's source can read the password below. Fine for
  // keeping a shared lobby list tidy among friends; change it to something of your own before
  // deploying, and don't rely on it to protect anything sensitive.
  const ADMIN_PASSWORD = 'ytdflf1973';
  let isAdmin = false;

  function fetchWithTimeout(url, options, ms) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), ms || 10000);
    return fetch(url, { ...options, signal: controller.signal }).finally(() => clearTimeout(timer));
  }

  // Firebase Realtime Database silently drops keys whose value is an empty array/object,
  // so a brand-new lobby (no bans/picks/history yet) comes back missing these fields entirely.
  // Restore sane defaults after every read so the rest of the app can always assume they exist.
  function normalizeRoom(r) {
    if (!r) return r;
    if (!Array.isArray(r.actions)) r.actions = [];
    if (!Array.isArray(r.history)) r.history = [];
    if (!Array.isArray(r.seriesPicked)) r.seriesPicked = [];
    return r;
  }

  async function readLobby(id) {
    const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/lobbies/${id}.json`);
    if (!res.ok) throw new Error('Firebase read failed: HTTP ' + res.status);
    const data = await res.json();
    return normalizeRoom(data) || null;
  }
  async function writeLobby(id, obj) {
    obj.updatedAt = Date.now();
    const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/lobbies/${id}.json`, {
      method: 'PUT',
      // text/plain avoids a CORS "preflight" OPTIONS request — Firebase still parses the JSON body fine either way.
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(obj)
    });
    if (!res.ok) throw new Error('Firebase write failed: HTTP ' + res.status);
  }
  async function fetchAllLobbies() {
    const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/lobbies.json`);
    if (!res.ok) throw new Error('Firebase read failed: HTTP ' + res.status);
    const data = await res.json();
    const result = data || {};
    Object.keys(result).forEach(id => normalizeRoom(result[id]));
    return result;
  }

  function heroById(id) { return allHeroes.find(h => h.id === id); }
  function currentStep(r) {
    if (!r) return null;
    const idx = (r.actions || []).length;
    return idx < 24 ? SEQUENCE[idx] : null;
  }
  function bannedIds(r) {
    const s = [];
    (r.actions || []).forEach((a, i) => { if (SEQUENCE[i].type === 'ban') s.push(a.heroId); });
    return s;
  }
  function pickedIds(r, side) {
    const s = [];
    (r.actions || []).forEach((a, i) => { if (SEQUENCE[i].type === 'pick' && SEQUENCE[i].side === side) s.push(a.heroId); });
    return s;
  }
  function standardTime(stepIdx) { return stepIdx === 0 ? 15 : 30; }
  function winsNeeded(r) { return FORMATS[r.format] || 1; }
  function seriesOver(r) { return r.fpWins >= winsNeeded(r) || r.spWins >= winsNeeded(r); }

  // ---------- lobby list ----------
  async function refreshLobbyList() {
    try {
      const data = await fetchAllLobbies();
      const arr = Object.keys(data)
        .map(id => ({ id, ...data[id] }))
        .filter(l => l.name && !seriesOver(l));
      arr.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
      lobbiesList = arr;
      connError = null;
    } catch (e) {
      connError = 'Не удалось получить список лобби: ' + e.message;
    }
  }
  function startListPolling() {
    stopListPolling();
    refreshLobbyList().then(render);
    listTimer = setInterval(async () => {
      await refreshLobbyList();
      if (activeTab === 'lobby' && lobbyView === 'list' && !joined) render();
    }, 2500);
  }
  function stopListPolling() {
    if (listTimer) clearInterval(listTimer);
    listTimer = null;
  }

  function goToList() {
    lobbyView = 'list';
    formError = null;
    startListPolling();
    render();
  }

  function toggleAdmin() {
    if (isAdmin) { isAdmin = false; render(); return; }
    const pw = prompt('Пароль администратора:');
    if (pw === null) return;
    if (pw === ADMIN_PASSWORD) { isAdmin = true; render(); }
    else alert('Неверный пароль.');
  }

  async function deleteLobby(id, name) {
    if (!confirm(`Удалить лобби «${name}» безвозвратно?`)) return;
    try {
      const res = await fetchWithTimeout(`${FIREBASE_DB_URL}/lobbies/${id}.json`, { method: 'DELETE' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      await refreshLobbyList();
      connError = null;
    } catch (e) {
      connError = 'Не удалось удалить лобби: ' + e.message;
    }
    render();
  }

  function goToCreate() {
    lobbyView = 'create';
    createName = '';
    createPassword = '';
    formError = null;
    stopListPolling();
    render();
  }
  function goToPassword(lobby) {
    selectedLobby = lobby;
    lobbyView = 'password';
    pwInput = '';
    pwError = null;
    stopListPolling();
    render();
  }

  async function createLobby() {
    if (!createName.trim() || !createPassword.trim()) return;
    busy = true; formError = null; render();
    try {
      const id = genId();
      const r = initLobbyState(createName.trim(), createPassword, lobbyFormat, lobbyFearless);
      await writeLobby(id, r);
      lobbyId = id;
      room = r;
      myRole = null;
      joined = true;
      lobbyView = 'inside';
      startTimers();
    } catch (e) {
      formError = 'Не удалось создать лобби: ' + e.message;
    }
    busy = false;
    render();
  }

  async function submitPassword() {
    if (!selectedLobby) return;
    busy = true; pwError = null; render();
    try {
      const r = await readLobby(selectedLobby.id);
      if (!r) { pwError = 'Это лобби больше не существует.'; busy = false; render(); return; }
      if (r.password !== pwInput) { pwError = 'Неверный пароль.'; busy = false; render(); return; }
      lobbyId = selectedLobby.id;
      room = r;
      myRole = null;
      joined = true;
      lobbyView = 'inside';
      startTimers();
    } catch (e) {
      pwError = 'Не удалось подключиться: ' + e.message;
    }
    busy = false;
    render();
  }

  async function claimSlot(side) {
    try {
      const r = await readLobby(lobbyId);
      if (!r || r[side === 'fp' ? 'fpReady' : 'spReady']) { room = r || room; render(); return; }
      r[side === 'fp' ? 'fpReady' : 'spReady'] = true;
      await writeLobby(lobbyId, r);
      room = r;
      myRole = side;
      connError = null;
    } catch (e) {
      connError = 'Не удалось занять слот: ' + e.message;
    }
    render();
  }

  async function startDraft() {
    try {
      const r = await readLobby(lobbyId);
      if (!r || !r.fpReady || !r.spReady || r.started) { room = r || room; render(); return; }
      r.started = true;
      r.stepStartedAt = Date.now();
      await writeLobby(lobbyId, r);
      room = r;
      connError = null;
    } catch (e) {
      connError = 'Не удалось начать драфт: ' + e.message;
    }
    render();
  }

  async function leaveLobby() {
    if (lobbyId && room && !room.started && (myRole === 'fp' || myRole === 'sp')) {
      try {
        const r = await readLobby(lobbyId);
        if (r) {
          r[myRole === 'fp' ? 'fpReady' : 'spReady'] = false;
          await writeLobby(lobbyId, r);
        }
      } catch (e) { /* leaving anyway */ }
    }
    joined = false;
    myRole = null;
    room = null;
    lobbyId = '';
    draftHeroSearch = '';
    stopTimers();
    goToList();
  }

  async function pollRoom() {
    if (!joined || !lobbyId) return;
    try {
      const r = await readLobby(lobbyId);
      if (r) { room = r; connError = null; if (activeTab === 'lobby') render(); }
    } catch (e) {
      connError = 'Нет связи с базой данных (' + e.message + ')';
    }
  }

  async function autoAdvanceIfTimedOut() {
    if (!joined || !lobbyId) return;
    let r;
    try { r = await readLobby(lobbyId); } catch (e) { return; }
    if (!r || !r.started || !r.stepStartedAt) return;
    const step = currentStep(r);
    if (!step) return;
    const idx = r.actions.length;
    const reserve = step.side === 'fp' ? r.fpReserve : r.spReserve;
    const allowed = standardTime(idx) + reserve;
    const elapsed = (Date.now() - r.stepStartedAt) / 1000;
    if (elapsed < allowed) return;

    const locked = new Set([...bannedIds(r), ...pickedIds(r, 'fp'), ...pickedIds(r, 'sp'), ...(r.fearless ? (r.seriesPicked || []) : [])]);
    let heroId = null;
    if (step.type === 'pick') {
      const pool = allHeroes.filter(h => !locked.has(h.id));
      if (pool.length) heroId = pool[Math.floor(Math.random() * pool.length)].id;
    }
    r.actions.push({ heroId });
    if (step.side === 'fp') r.fpReserve = 0; else r.spReserve = 0;
    r.stepStartedAt = Date.now();
    try { await writeLobby(lobbyId, r); room = r; } catch (e) { /* will retry next tick */ }
  }

  function startTimers() {
    stopTimers();
    pollTimer = setInterval(pollRoom, 1400);
    tickTimer = setInterval(async () => {
      await autoAdvanceIfTimedOut();
      if (activeTab === 'lobby') render();
    }, 1000);
  }
  function stopTimers() {
    if (pollTimer) clearInterval(pollTimer);
    if (tickTimer) clearInterval(tickTimer);
    pollTimer = null; tickTimer = null;
  }

  async function pickHero(heroId) {
    let r;
    try { r = await readLobby(lobbyId); } catch (e) { connError = 'Нет связи с базой данных: ' + e.message; render(); return; }
    r = r || room;
    const step = currentStep(r);
    if (!step || step.side !== myRole) return;
    const locked = new Set([...bannedIds(r), ...pickedIds(r, 'fp'), ...pickedIds(r, 'sp'), ...(r.fearless ? (r.seriesPicked || []) : [])]);
    if (locked.has(heroId)) return;
    const idx = r.actions.length;
    const reserve = step.side === 'fp' ? r.fpReserve : r.spReserve;
    const elapsed = (Date.now() - r.stepStartedAt) / 1000;
    const overflow = Math.max(0, elapsed - standardTime(idx));
    const used = Math.min(overflow, reserve);
    if (step.side === 'fp') r.fpReserve = Math.max(0, r.fpReserve - used);
    else r.spReserve = Math.max(0, r.spReserve - used);
    r.actions.push({ heroId });
    r.stepStartedAt = Date.now();
    try {
      await writeLobby(lobbyId, r);
      connError = null;
    } catch (e) {
      connError = 'Не удалось сохранить ход: ' + e.message;
    }
    room = r;
    render();
  }

  // Called from the "Игра окончена" panel once the draft for the current game is complete.
  async function finishGame(winnerSide) {
    let r;
    try { r = await readLobby(lobbyId); } catch (e) { connError = 'Нет связи с базой данных: ' + e.message; render(); return; }
    r = r || room;
    if (currentStep(r)) return; // draft not actually finished yet
    const fpPicks = pickedIds(r, 'fp');
    const spPicks = pickedIds(r, 'sp');
    r.history.push({ gameNumber: r.gameNumber, fpPicks, spPicks, winner: winnerSide });
    if (winnerSide === 'fp') r.fpWins++; else r.spWins++;
    if (r.fearless) {
      const combined = new Set([...(r.seriesPicked || []), ...fpPicks, ...spPicks]);
      r.seriesPicked = [...combined];
    }
    if (!seriesOver(r)) {
      r.gameNumber++;
      Object.assign(r, freshGameFields());
      r.stepStartedAt = Date.now(); // both captains already in place, next game starts immediately
    }
    try {
      await writeLobby(lobbyId, r);
      connError = null;
    } catch (e) {
      connError = 'Не удалось сохранить результат игры: ' + e.message;
    }
    room = r;
    render();
  }

  async function resetSeries() {
    if (!lobbyId) return;
    const prev = room || {};
    const r = {
      ...initLobbyState(prev.name, prev.password, prev.format, prev.fearless),
      fpReady: prev.fpReady, spReady: prev.spReady,
      started: true, stepStartedAt: Date.now()
    };
    try {
      await writeLobby(lobbyId, r);
      connError = null;
    } catch (e) {
      connError = 'Не удалось начать новую серию: ' + e.message;
    }
    room = r;
    render();
  }

  // ---------- render ----------
  function render() {
    ROOT.querySelectorAll('.dd-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === activeTab));
    // Re-rendering replaces the whole body via innerHTML, which would otherwise snap any
    // scrollable list (like the hero pick grid) back to the top, and any focused text input's
    // cursor to the end, on every timer tick/poll — so save and restore both here.
    const scrollable = BODY.querySelector('.dd-hero-pick-grid');
    const savedScroll = scrollable ? scrollable.scrollTop : null;
    const active = document.activeElement;
    const activeId = (active && BODY.contains(active) && active.id) ? active.id : null;
    const savedSelStart = (activeId && active.selectionStart != null) ? active.selectionStart : null;
    const savedSelEnd = (activeId && active.selectionEnd != null) ? active.selectionEnd : null;

    BODY.innerHTML = activeTab === 'db' ? renderDb() : renderLobbyTab();
    attachHandlers();

    if (savedScroll !== null) {
      const restored = BODY.querySelector('.dd-hero-pick-grid');
      if (restored) restored.scrollTop = savedScroll;
    }
    if (activeId) {
      const restoredEl = document.getElementById(activeId);
      if (restoredEl) {
        restoredEl.focus();
        if (savedSelStart !== null && restoredEl.setSelectionRange) {
          try { restoredEl.setSelectionRange(savedSelStart, savedSelEnd); } catch (e) { /* not a text input */ }
        }
      }
    }
  }

  function renderDb() {
    if (!allHeroes.length) return `<div class="dd-empty-state">Загрузка героев&hellip;</div>`;
    const filtered = allHeroes.filter(h =>
      (dbFilter === 'all' || h.attr === dbFilter) &&
      h.name.toLowerCase().includes(dbSearch.toLowerCase())
    );
    const attrKeys = ['str', 'agi', 'int', 'all'];
    return `
      <div class="dd-controls">
        <input class="dd-search" id="dd-search" placeholder="Поиск героя&hellip;" value="${dbSearch}">
        <button class="dd-filter-btn ${dbFilter==='all'?'active':''}" data-attr="all">Все</button>
        ${attrKeys.map(k => `<button class="dd-filter-btn ${dbFilter===k?'active':''}" data-attr="${k}">${ATTR_META[k].label}</button>`).join('')}
        <span class="dd-count">${filtered.length} героев</span>
      </div>
      <div class="dd-hero-grid">
        ${filtered.map(h => `
          <div class="dd-hero-card">
            ${heroAvatar(h, 'dd-hero-img')}
            <div class="dd-hero-name">${h.name}</div>
            <div class="dd-hero-attr"><span class="dd-dot" style="background:${ATTR_META[h.attr].color}"></span>${ATTR_META[h.attr].label}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function fmtTime(sec) {
    sec = Math.max(0, Math.ceil(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m > 0 ? `${m}:${String(s).padStart(2, '0')}` : `${s}с`;
  }

  function renderLobbyTab() {
    if (!allHeroes.length) return `<div class="dd-empty-state">Загрузка героев&hellip;</div>`;
    if (!FIREBASE_CONFIGURED) {
      return `<div class="dd-error">Лобби ещё не настроено: откройте файл в редакторе и вставьте адрес вашей Firebase Realtime Database в константу <code>FIREBASE_DB_URL</code> в начале скрипта (инструкция — в комментарии рядом с этой строкой).</div>`;
    }

    if (!joined) {
      if (lobbyView === 'create') return renderCreateScreen();
      if (lobbyView === 'password') return renderPasswordScreen();
      return renderListScreen();
    }

    const r = room;
    if (!r) return `<div class="dd-empty-state">Загрузка лобби&hellip;</div>`;
    if (!r.started) return renderWaitingRoom(r);
    return renderActiveDraft(r);
  }

  function renderListScreen() {
    return `
      <div class="dd-lobby-header-row">
        <h3>Активные лобби</h3>
        <div class="dd-row-gap">
          <button class="dd-btn-secondary" id="dd-admin-toggle">${isAdmin ? 'Выйти из админки' : 'Админ'}</button>
          <button class="dd-btn-primary" style="width:auto; margin:0; padding:9px 16px;" id="dd-create-open">+ Создать лобби</button>
        </div>
      </div>
      ${connError ? `<div class="dd-error" style="margin-bottom:14px;">${connError}</div>` : ''}
      ${lobbiesList.length === 0 ? `<div class="dd-empty-state">Активных лобби пока нет — создайте своё.</div>` : `
        <div class="dd-lobby-list">
          ${lobbiesList.map(l => {
            const players = (l.fpReady ? 1 : 0) + (l.spReady ? 1 : 0);
            return `
            <div class="dd-lobby-item">
              <div>
                <div class="dd-lobby-item-name">${esc(l.name)}</div>
                <div class="dd-lobby-item-meta">
                  <span>${(l.format || '').toUpperCase()}</span>
                  <span>Игроков: ${players}/2</span>
                  ${l.fearless ? '<span class="fearless">FEARLESS DRAFT</span>' : ''}
                </div>
              </div>
              <div class="dd-row-gap">
                ${isAdmin ? `<button class="dd-btn-secondary" style="color:var(--dire); border-color:var(--dire);" data-delete-id="${l.id}" data-delete-name="${esc(l.name)}">Удалить</button>` : ''}
                <button class="dd-btn-secondary" data-join-id="${l.id}" data-join-name="${esc(l.name)}">Войти</button>
              </div>
            </div>
          `;
          }).join('')}
        </div>
      `}
    `;
  }

  function renderCreateScreen() {
    return `
      <div class="dd-lobby">
        <h3>Новое лобби</h3>
        <p>Придумайте название и пароль. Их нужно будет сообщить второму капитану, чтобы он мог зайти.</p>
        ${formError ? `<div class="dd-error" style="margin-bottom:14px;">${formError}</div>` : ''}
        <div class="dd-field">
          <label class="dd-label">Название лобби</label>
          <input class="dd-input" id="dd-create-name" placeholder="Например, Пятничный драфт" maxlength="40" value="${esc(createName)}">
        </div>
        <div class="dd-field">
          <label class="dd-label">Пароль</label>
          <input class="dd-input" id="dd-create-pass" type="text" placeholder="Придумайте пароль" maxlength="40" value="${esc(createPassword)}">
        </div>
        <div class="dd-field">
          <label class="dd-label">Формат серии</label>
          <div class="dd-format-row">
            ${Object.keys(FORMATS).map(f => `<button class="dd-format-btn ${lobbyFormat===f?'active':''}" data-format="${f}">${f.toUpperCase()}</button>`).join('')}
          </div>
        </div>
        <div class="dd-field">
          <label class="dd-toggle-row">
            <input type="checkbox" id="dd-fearless-toggle" ${lobbyFearless ? 'checked' : ''}>
            <span>
              <span class="dd-toggle-text">Fearless Draft</span>
              <span class="dd-toggle-sub">Герои, выбранные в прошлых играх серии, недоступны для пика в следующих (баны каждую игру обычные)</span>
            </span>
          </label>
        </div>
        <div class="dd-row-gap">
          <button class="dd-btn-secondary" id="dd-create-back">Назад</button>
          <button class="dd-btn-primary" id="dd-create-submit" ${(createName.trim() && createPassword.trim() && !busy) ? '' : 'disabled'}>${busy ? 'Создание…' : 'Создать и войти'}</button>
        </div>
      </div>
    `;
  }

  function renderPasswordScreen() {
    return `
      <div class="dd-lobby">
        <h3>${esc(selectedLobby.name)}</h3>
        <p>Введите пароль этого лобби, чтобы войти.</p>
        ${pwError ? `<div class="dd-error" style="margin-bottom:14px;">${pwError}</div>` : ''}
        <div class="dd-field">
          <label class="dd-label">Пароль</label>
          <input class="dd-input" id="dd-pw-input" type="text" placeholder="Пароль" value="${esc(pwInput)}">
        </div>
        <div class="dd-row-gap">
          <button class="dd-btn-secondary" id="dd-pw-back">Назад</button>
          <button class="dd-btn-primary" id="dd-pw-submit" ${busy ? 'disabled' : ''}>${busy ? 'Проверка…' : 'Войти'}</button>
        </div>
      </div>
    `;
  }

  function renderWaitingRoom(r) {
    return `
      <div class="dd-lobby" style="max-width:560px;">
        <h3>${esc(r.name)}</h3>
        <p>${(r.format || '').toUpperCase()} ${r.fearless ? '· Fearless Draft' : ''} — займите сторону и нажмите «Начать», когда оба капитана готовы. Можно также просто наблюдать.</p>
        ${connError ? `<div class="dd-error" style="margin-bottom:14px;">${connError}</div>` : ''}
        <div class="dd-waiting-slots">
          <div class="dd-slot-box fp ${r.fpReady ? 'filled' : ''} ${r.fpReady && myRole !== 'fp' ? 'taken' : ''}" id="dd-slot-fp">
            <div class="slot-label">RADIANT</div>
            <div class="slot-status">${r.fpReady ? (myRole === 'fp' ? 'Вы здесь' : 'Занято') : 'Свободно — нажмите, чтобы занять'}</div>
          </div>
          <div class="dd-slot-box sp ${r.spReady ? 'filled' : ''} ${r.spReady && myRole !== 'sp' ? 'taken' : ''}" id="dd-slot-sp">
            <div class="slot-label">DIRE</div>
            <div class="slot-status">${r.spReady ? (myRole === 'sp' ? 'Вы здесь' : 'Занято') : 'Свободно — нажмите, чтобы занять'}</div>
          </div>
          <div class="dd-slot-box obs ${myRole === 'observer' ? 'filled' : ''}" id="dd-slot-obs">
            <div class="slot-label">НАБЛЮДАТЕЛЬ</div>
            <div class="slot-status">${myRole === 'observer' ? 'Вы здесь' : 'Смотреть без участия'}</div>
          </div>
        </div>
        <div class="dd-row-gap">
          <button class="dd-btn-secondary" id="dd-leave">Покинуть лобби</button>
          <button class="dd-btn-primary" id="dd-start" ${(r.fpReady && r.spReady) ? '' : 'disabled'}>Начать</button>
        </div>
      </div>
    `;
  }

  function renderActiveDraft(r) {
    const step = currentStep(r);
    const banned = bannedIds(r);
    const fpPicks = pickedIds(r, 'fp');
    const spPicks = pickedIds(r, 'sp');
    const gameOver = !step;
    const over = seriesOver(r);

    const seriesBar = `
      <div class="dd-series-bar">
        <div class="dd-series-left">
          <span>${esc(r.name)} · Игра ${r.gameNumber} · ${r.format.toUpperCase()}</span>
          <span class="dd-score"><span class="fp">${r.fpWins}</span> : <span class="sp">${r.spWins}</span></span>
          ${r.fearless ? '<span class="dd-fearless-badge">FEARLESS DRAFT</span>' : ''}
        </div>
        <div><button class="dd-btn-secondary" id="dd-leave">Выйти</button></div>
      </div>
      ${connError ? `<div class="dd-error" style="margin-bottom:14px;">${connError}</div>` : ''}
    `;

    if (over) {
      const winnerText = r.fpWins > r.spWins ? 'Radiant' : 'Dire';
      return `
        ${seriesBar}
        <div class="dd-series-over">
          <h4>Серия завершена — победили ${winnerText}!</h4>
          <p>Счёт ${r.fpWins}:${r.spWins} (${r.format.toUpperCase()})</p>
          <button class="dd-btn-secondary" id="dd-reset">Новая серия</button>
        </div>
        ${renderHistory(r)}
      `;
    }

    if (gameOver) {
      return `
        ${seriesBar}
        <div class="dd-gameover">
          <h4>Игра ${r.gameNumber} окончена</h4>
          <p>Отметьте победителя, чтобы засчитать результат и начать следующую игру${r.fearless ? ' (пики этой игры блокируются в Fearless Draft)' : ''}.</p>
          <div class="dd-winner-row">
            <button class="dd-winner-btn fp" data-winner="fp">Победила Radiant</button>
            <button class="dd-winner-btn sp" data-winner="sp">Победила Dire</button>
          </div>
        </div>
        <div class="dd-draft-layout">
          ${teamPanel('fp', fpPicks, 'RADIANT · First Pick', r)}
          <div></div>
          ${teamPanel('sp', spPicks, 'DIRE · Second Pick', r)}
        </div>
        ${renderHistory(r)}
      `;
    }

    const isMyTurn = step.side === myRole;
    const idx = r.actions.length;
    const reserve = step.side === 'fp' ? r.fpReserve : r.spReserve;
    const elapsed = (Date.now() - r.stepStartedAt) / 1000;
    const std = standardTime(idx);
    const inReserve = elapsed > std;
    const remaining = inReserve ? Math.max(0, std + reserve - elapsed) : Math.max(0, std - elapsed);
    const timerClass = inReserve ? 'reserve' : (remaining <= 5 ? 'low' : '');
    const statusHtml = `<div class="dd-status-bar">
        <div class="dd-status-left">
          <span class="dd-badge ${step.type}">${step.type === 'ban' ? 'БАН' : 'ПИК'} · шаг ${step.n}/24</span>
          <span class="${isMyTurn ? 'dd-your-turn' : 'dd-wait-turn'}">${isMyTurn ? 'Ваш ход' : (step.side === 'fp' ? 'Ход Radiant' : 'Ход Dire')}</span>
          <span class="dd-timer ${timerClass}">${fmtTime(remaining)}${inReserve ? ' (резерв)' : ''}</span>
        </div>
      </div>`;

    const timeline = `<div class="dd-timeline">${SEQUENCE.map((s, i) => {
      const done = i < r.actions.length;
      const cur = s.n === step.n;
      return `<div class="dd-tstep ${s.side} ${done ? 'done' : ''} ${cur ? 'current' : ''}" title="Шаг ${s.n}: ${s.side==='fp'?'Radiant':'Dire'} ${s.type==='ban'?'бан':'пик'}">${s.type==='ban'?'✕':'✓'}</div>`;
    }).join('')}</div>`;

    const takenSet = new Set([...banned, ...fpPicks, ...spPicks]);
    const seriesLocked = new Set(r.fearless ? (r.seriesPicked || []) : []);
    const isMyTurnNow = step.side === myRole;
    const visibleHeroes = allHeroes.filter(h => h.name.toLowerCase().includes(draftHeroSearch.toLowerCase()));
    const heroGrid = `
      <input class="dd-search" id="dd-draft-search" placeholder="Поиск героя&hellip;" value="${esc(draftHeroSearch)}" style="width:100%; margin-bottom:8px;">
      <div class="dd-hero-pick-grid">
        ${visibleHeroes.map(h => {
          const lockedBySeries = seriesLocked.has(h.id) && !takenSet.has(h.id);
          const disabled = !isMyTurnNow || takenSet.has(h.id) || lockedBySeries;
          return `
          <div class="dd-pick-card ${disabled ? 'disabled' : ''} ${lockedBySeries ? 'fearless-locked' : ''}" data-hero-id="${h.id}" title="${lockedBySeries ? 'Уже выбран ранее в этой серии (Fearless Draft)' : h.name}">
            ${heroAvatar(h, 'dd-hero-img')}
            <div class="dd-hero-name">${h.name}</div>
          </div>`;
        }).join('')}
        ${visibleHeroes.length === 0 ? '<div class="dd-empty-state" style="grid-column:1/-1;">Ничего не найдено</div>' : ''}
      </div>
    `;

    const roleLabel = myRole === 'fp' ? 'Radiant (First Pick)' : myRole === 'sp' ? 'Dire (Second Pick)' : 'наблюдатель';

    return `
      ${seriesBar}
      ${statusHtml}
      ${timeline}
      <div class="dd-draft-layout">
        ${teamPanel('fp', fpPicks, 'RADIANT · First Pick', r)}
        <div>${heroGrid}</div>
        ${teamPanel('sp', spPicks, 'DIRE · Second Pick', r)}
      </div>
      <div class="dd-footer-note">Лобби «${esc(r.name)}» · Вы — ${roleLabel}. Таймер: 15 сек на первый бан, 30 сек на остальные шаги, плюс резерв 130 сек на сторону за игру. ${r.fearless ? 'Режим Fearless Draft: пикнутые в прошлых играх серии герои недоступны для пика.' : ''}</div>
    `;
  }

  function teamPanel(side, picks, label, r) {
    const banSlots = SEQUENCE.filter(s => s.type === 'ban' && s.side === side).length;
    const sideBans = [];
    r.actions.forEach((a, i) => { if (SEQUENCE[i].type === 'ban' && SEQUENCE[i].side === side) sideBans.push(a.heroId); });
    const reserve = side === 'fp' ? r.fpReserve : r.spReserve;
    return `
      <div class="dd-team-panel ${side}">
        <div class="dd-team-title-row">
          <div class="dd-team-title">${label}</div>
          <div class="dd-team-reserve">резерв ${fmtTime(reserve)}</div>
        </div>
        <div class="dd-slot-label">Пики (${picks.length}/5)</div>
        <div class="dd-picks-row">
          ${Array.from({length:5}).map((_,i) => {
            const id = picks[i];
            const h = id ? heroById(id) : null;
            return h ? `<div class="dd-slot">${heroAvatar(h, 'dd-slot-avatar')}<span>${h.name}</span></div>` : `<div class="dd-slot empty">&mdash;</div>`;
          }).join('')}
        </div>
        <div class="dd-slot-label">Баны (${sideBans.length}/${banSlots})</div>
        <div class="dd-bans-row">
          ${Array.from({length:banSlots}).map((_,i) => {
            const id = sideBans[i];
            const h = id ? heroById(id) : null;
            return h ? `<div class="dd-slot ban-slot" title="${h.name}">${heroAvatar(h, 'dd-slot-avatar')}</div>` : `<div class="dd-slot ban-slot empty">&mdash;</div>`;
          }).join('')}
        </div>
      </div>
    `;
  }

  function renderHistory(r) {
    const history = r.history || [];
    if (!history.length) return '';
    return `
      <div class="dd-history">
        <h5>История серии</h5>
        ${history.map(g => `
          <div class="dd-history-game">
            <div class="num">Игра ${g.gameNumber}</div>
            <div class="dd-history-picks ${g.winner==='fp'?'winner':''}">${g.fpPicks.map(id => { const h = heroById(id); return h ? heroAvatar(h, 'dd-history-avatar') : ''; }).join('')}</div>
            <div class="dd-history-picks ${g.winner==='sp'?'winner':''}">${g.spPicks.map(id => { const h = heroById(id); return h ? heroAvatar(h, 'dd-history-avatar') : ''; }).join('')}</div>
          </div>
        `).join('')}
      </div>
    `;
  }

  function attachHandlers() {
    ROOT.querySelectorAll('.dd-tab').forEach(t => t.onclick = () => {
      activeTab = t.dataset.tab;
      if (activeTab === 'lobby' && !joined && lobbyView === 'list') startListPolling(); else stopListPolling();
      render();
    });

    const search = document.getElementById('dd-search');
    if (search) search.oninput = (e) => { dbSearch = e.target.value; render(); };
    ROOT.querySelectorAll('.dd-filter-btn').forEach(b => b.onclick = () => { dbFilter = b.dataset.attr; render(); });

    // --- lobby list ---
    const createOpenBtn = document.getElementById('dd-create-open');
    if (createOpenBtn) createOpenBtn.onclick = goToCreate;
    const adminToggle = document.getElementById('dd-admin-toggle');
    if (adminToggle) adminToggle.onclick = toggleAdmin;
    ROOT.querySelectorAll('[data-join-id]').forEach(b => b.onclick = () => goToPassword({ id: b.dataset.joinId, name: b.dataset.joinName }));
    ROOT.querySelectorAll('[data-delete-id]').forEach(b => b.onclick = () => deleteLobby(b.dataset.deleteId, b.dataset.deleteName));

    // --- create screen ---
    const nameInput = document.getElementById('dd-create-name');
    if (nameInput) nameInput.oninput = (e) => { createName = e.target.value; document.getElementById('dd-create-submit').disabled = !(createName.trim() && createPassword.trim()); };
    const passInput = document.getElementById('dd-create-pass');
    if (passInput) passInput.oninput = (e) => { createPassword = e.target.value; document.getElementById('dd-create-submit').disabled = !(createName.trim() && createPassword.trim()); };
    ROOT.querySelectorAll('.dd-format-btn').forEach(b => b.onclick = () => { lobbyFormat = b.dataset.format; render(); });
    const fearlessToggle = document.getElementById('dd-fearless-toggle');
    if (fearlessToggle) fearlessToggle.onchange = (e) => { lobbyFearless = e.target.checked; };
    const createBack = document.getElementById('dd-create-back');
    if (createBack) createBack.onclick = goToList;
    const createSubmit = document.getElementById('dd-create-submit');
    if (createSubmit) createSubmit.onclick = createLobby;

    // --- password screen ---
    const pwField = document.getElementById('dd-pw-input');
    if (pwField) pwField.oninput = (e) => { pwInput = e.target.value; };
    const pwBack = document.getElementById('dd-pw-back');
    if (pwBack) pwBack.onclick = goToList;
    const pwSubmit = document.getElementById('dd-pw-submit');
    if (pwSubmit) pwSubmit.onclick = submitPassword;

    // --- waiting room ---
    const slotFp = document.getElementById('dd-slot-fp');
    if (slotFp) slotFp.onclick = () => { if (!room.fpReady) claimSlot('fp'); };
    const slotSp = document.getElementById('dd-slot-sp');
    if (slotSp) slotSp.onclick = () => { if (!room.spReady) claimSlot('sp'); };
    const slotObs = document.getElementById('dd-slot-obs');
    if (slotObs) slotObs.onclick = () => { myRole = 'observer'; render(); };
    const startBtn = document.getElementById('dd-start');
    if (startBtn) startBtn.onclick = startDraft;

    // --- active draft ---
    const draftSearchInput = document.getElementById('dd-draft-search');
    if (draftSearchInput) draftSearchInput.oninput = (e) => { draftHeroSearch = e.target.value; render(); };
    const leaveBtn = document.getElementById('dd-leave');
    if (leaveBtn) leaveBtn.onclick = leaveLobby;
    const resetBtn = document.getElementById('dd-reset');
    if (resetBtn) resetBtn.onclick = resetSeries;
    ROOT.querySelectorAll('.dd-winner-btn').forEach(b => b.onclick = () => finishGame(b.dataset.winner));
    ROOT.querySelectorAll('.dd-pick-card:not(.disabled)').forEach(c => c.onclick = () => pickHero(parseInt(c.dataset.heroId, 10)));
  }

  loadHeroes();
})();
</script>
